# Full-stack one-command deploy: Supabase (remote) + Data service + Orchestrator API
# Run from workspace root (parent of orchestrator/ and data-ingestion-service/):
#   docker-compose -f orchestrator/docker-compose.full.yml up --build
#
# Set DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY (and optionally FINNHUB_API_KEY, OPENAI_API_KEY)
# in .env at workspace root or in your environment.
#
# Then:
#   Orchestrator API:  http://localhost:8000   Docs: http://localhost:8000/docs
#   Data service API:  http://localhost:8001   (prices, news, insider)

services:
  data-service:
    build:
      context: ../data-ingestion-service
      dockerfile: Dockerfile
    container_name: qtos-data-service
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRACKED_SYMBOLS=${TRACKED_SYMBOLS:-SPY,QQQ,TLT,AAPL,MSFT}
    ports:
      - "8001:8001"
    restart: unless-stopped

  data-scheduler:
    build:
      context: ../data-ingestion-service
      dockerfile: Dockerfile
    container_name: qtos-data-scheduler
    command: python scheduler.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRACKED_SYMBOLS=${TRACKED_SYMBOLS:-SPY,QQQ,TLT,AAPL,MSFT}
      - PRICE_INTERVAL_SECONDS=3600
      - NEWS_INTERVAL_SECONDS=1800
      - INSIDER_INTERVAL_SECONDS=21600
    restart: unless-stopped
    depends_on:
      - data-service

  skill-indexer:
    build:
      context: ../data-ingestion-service
      dockerfile: Dockerfile
    container_name: qtos-skill-indexer
    command: python -m skill_graph_indexer
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - data-service
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: orchestrator/Dockerfile
    container_name: qtos-orchestrator
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATA_SERVICE_URL=http://data-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ../orchestrator/state:/app/orchestrator/state
    depends_on:
      - data-service
