# Run from workspace root (parent of orchestrator/):
#   docker-compose -f orchestrator/docker-compose.yml up --build
# API: http://localhost:8000  Docs: http://localhost:8000/docs
# Set DATABASE_URL, SUPABASE_* (and optionally FINNHUB_API_KEY, OPENAI_API_KEY) in .env.

services:
  api:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATA_SERVICE_URL=${DATA_SERVICE_URL:-http://localhost:8001}
    env_file:
      - .env
    volumes:
      - ./orchestrator/state:/app/orchestrator/state
